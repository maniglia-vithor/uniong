name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (testes Django em SQLite)
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: chave-apenas-para-o-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=ong_backend.settings_test

  frontend:
    name: Frontend (oxlint, Vitest e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ong_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ong_frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
