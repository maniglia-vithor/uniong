# nginx do container "web": serve o React e encaminha API, prévias e admin do Django ao backend.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Anexos e imagens têm até 5 MB cada; despesas aceitam vários anexos por envio.
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /c/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin-django/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Arquivos do collectstatic (admin do Django e DRF), compartilhados por volume.
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Arquivos do build do Vite têm hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Rotas do React (/admin, /transparencia, ...) caem no index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
